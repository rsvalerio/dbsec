name: Publish

# Manual, not tag-triggered. Cocogitto bumps the version on every
# conventional-commit merge to main, so publishing on `v*` would mean a
# crates.io release per feature merge. Releasing is a decision; this workflow
# is where it is taken.
#
# Run it once with `real: false` — that packages and verifies every crate
# without contacting the registry — and again with `real: true` to upload.
# The reusable workflow carries two interlocks of its own: `dry-run` defaults
# to true, and turning it off additionally requires `allow-real-publish`.
#
# `cargo publish --workspace` (the reusable workflow's default) orders the
# crates itself: dbsec-derive and dbsec-pgwire, then dbsec-core, then
# dbsec-vault, then dbsec.
on:
  workflow_dispatch:
    inputs:
      real:
        description: "Publish for real (leave off for a dry run)"
        type: boolean
        default: false

jobs:
  crates:
    uses: rsvalerio/forge/.github/workflows/publish-crates.yml@v1
    with:
      dry-run: ${{ !inputs.real }}
      allow-real-publish: ${{ inputs.real }}
      # A token for the first release: crates.io Trusted Publishing is
      # configured per-crate on a crate that already exists, so it cannot
      # claim a new name. Switch to `trusted` once 0.6.0 is on the registry
      # and each crate has its publisher configured.
      auth: ${{ inputs.real && 'token' || 'none' }}
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

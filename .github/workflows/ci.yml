name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    uses: rsvalerio/forge/.github/workflows/rust-ci.yml@v1
    with:
      # The shared workflow's test job runs `cargo test`. This repo runs the
      # suite under nextest instead, in the `test` job below, so the shared one
      # is turned off rather than duplicated. Every other gate (fmt, check,
      # clippy, build, deny) still comes from forge.
      run-tests: false

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # No `--run-ignored`: every ignored test needs the Postgres/OpenBao
      # services, and those suites run in `e2e.yml`. Doctests are a separate
      # step because nextest does not run them.
      - name: cargo nextest run --all --all-features
        run: cargo nextest run --all --all-features
      - name: cargo test --all --all-features --doc
        run: cargo test --all --all-features --doc

  # Not in the shared `rust-ci` workflow, which runs fmt, check, clippy, build,
  # test and deny — all of them compiler lints. `broken_intra_doc_links = "deny"`
  # is a rustdoc lint and fires only during a documentation build, so without
  # this job it is enforced by whoever happens to run `cargo doc` locally. The
  # links it was added to fix accumulated for exactly that reason.
  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # `cargo doc` runs build scripts and proc macros, and a checkout
          # leaves GITHUB_TOKEN in .git/config unless told not to.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc
        run: cargo doc --no-deps --document-private-items --all-features

  # The reusable workflows above follow forge automatically because they are
  # referenced by tag; the config files copied out of forge do not. This job is
  # what makes "keep in sync" a checked claim rather than a remembered one.
  forge-sync:
    name: forge config drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: ./scripts/forge-sync-check.sh

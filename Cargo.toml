[workspace]
resolver = "2"
members = ["crates/core", "crates/pgwire", "crates/proxy"]
exclude = ["fuzz"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/rsvalerio/dbsec"

[workspace.dependencies]
dbsec-core = { path = "crates/core" }
dbsec-pgwire = { path = "crates/pgwire" }

# async runtime + protocol
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "signal", "time"] }
postgres-protocol = "0.6"
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.13"
sqlparser = "0.53"

# crypto
#
# `aes` carries the `zeroize` feature for both its own users (FF1) and
# `aes-gcm`, which has no such feature of its own but builds its cipher out of
# this crate. Without it the expanded AES round-key schedule — from which the
# original key is recoverable — is left intact in freed heap when a DEK rolls
# and its `Cipher` drops, while the `Zeroizing` key bytes it was derived from
# are wiped. Cargo unifies features per package, so enabling it here covers
# every `Aes256` in the graph.
# `envelope::tests::the_aes_key_schedule_is_wiped_when_a_cipher_drops` fails if
# it is ever dropped.
#
# The round-key schedule is not the only key-derived state inside
# `Aes256Gcm`: it also holds `ghash: GHash`, built from the authentication
# subkey `H = E_K(0^128)`, and that copy is *not* wiped when a `Cipher` drops.
# `ghash` and `polyval` are deliberately NOT added here to close it, because
# adding them would not close it. Checked against ghash 0.5.1 / polyval 0.6.2,
# the versions aes-gcm 0.10 resolves:
#
#   * `ghash`'s `zeroize` feature wipes two *construction-time locals* in
#     `GHash::new_with_init_block` (`h`, `h_polyval`) and nothing else. It does
#     not forward to `polyval` — `ghash`'s only feature forwarding is
#     `std = ["polyval/std"]`.
#   * `polyval`'s `zeroize` feature adds `impl Drop` to its `soft` and `clmul`
#     backends. On x86/x86_64 and aarch64 — every target dbsec ships on —
#     `polyval::Polyval` is `backend::autodetect::Polyval`, which holds its
#     backend in a `union Inner` of `ManuallyDrop`. A union never runs drop
#     glue on its fields and `autodetect::Polyval` has no `Drop` of its own, so
#     those backend destructors are unreachable. The `pmull` (aarch64) backend
#     does not even have one — it is a TODO in the upstream source.
#
# So the trade is not "two unused direct dependencies for a wipe"; it is two
# unused direct dependencies, version-coupled to whatever aes-gcm 0.10 pins,
# for no wipe at all on the platforms that matter. The only builds it would
# reach are `--cfg polyval_force_soft` ones, which give up hardware GHASH on
# the data path to wipe 16 bytes. Revisit if upstream gives
# `autodetect::Polyval` a `Drop`; until then `H` is accepted as surviving in
# freed heap, and the module docs in `crates/core/src/envelope.rs` say so.
aes = { version = "0.8", features = ["zeroize"] }
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
fpe = "0.6"
hex = "0.4"

# tls
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pki-types = "1"

# kms
vaultrs = "0.7"
base64 = "0.22"
# `[vault] addr` is parsed before it reaches vaultrs, whose own address setter
# is documented "# Panics" and does `Url::parse(..).unwrap()`. Same crate and
# same version vaultrs itself resolves, so the two agree on what a valid Vault
# address is by construction rather than by imitation.
url = "2"

# process hardening (unix only): `RLIMIT_CORE` and `prctl(PR_SET_DUMPABLE)`.
# rustix rather than libc because the workspace forbids `unsafe_code` — these
# are the two syscalls the proxy makes directly, and rustix exposes both behind
# a safe signature. It is already in the graph via `tempfile`.
rustix = { version = "1", features = ["process"] }

# config / errors / logging
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# test-only
proptest = "1"
tempfile = "3"
# The e2e COPY case drives tokio-postgres' Sink/Stream copy API by hand.
futures-util = { version = "0.3", default-features = false }

# Lint policy lives here rather than in the flags CI happens to pass, so a local
# `cargo clippy` enables exactly the set CI enables and both member crates — and
# every future one — get it by inheriting with `[lints] workspace = true`.
# `clippy.toml` can only tune thresholds for lints that are already on; this is
# the table that turns them on.
#
# Levels are `deny`, not `warn`: the shared forge workflow runs clippy with
# `-D warnings`, so a `warn` here would be an error in CI and a passing build
# locally, which is the divergence this table exists to remove. Groups that this
# codebase does not satisfy today (`clippy::pedantic`, `missing_docs`) are
# deliberately left out rather than enabled and then blanket-allowed.
[workspace.lints.rust]
# The point of the exercise: a field-level encryption library that can state, in
# a machine-checked way, that it contains no unsafe code. `forbid` rather than
# `deny` so no module can re-allow it with an attribute. `fuzz/` is `exclude`d
# from the workspace and cannot inherit this — libfuzzer's `fuzz_target!`
# expands to an `extern "C"` entry point that is unsafe by construction, so a
# forbid there would only be satisfiable by not fuzzing.
unsafe_code = "forbid"
unused_qualifications = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"

# rustdoc lints. `cargo doc` is where the module-level prose in `encrypt/` is
# actually read as one document, and a broken `[`Item`]` there is a silent loss:
# the reasoning about why a site is or is not an `Unprotected` hole is spread
# across sibling modules, and the links are how a reviewer walks from one half
# of that argument to the other. `deny` so the next module move fails the doc
# build instead of quietly unlinking the prose.
[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# Debugging and placeholder leftovers: cheap to keep out, expensive to find in a
# proxy that sits on production traffic.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# Skipping a destructor on key material would leave it unzeroized.
mem_forget = "deny"

[profile.release]
lto = "thin"
strip = true

[package]
name = "dbsec-core"
description = "Field-level encryption, pseudonymization and masking for PostgreSQL columns"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/dbsec-core"
keywords = ["encryption", "postgresql", "field-level", "pseudonymization", "aes-gcm"]
categories = ["cryptography", "database"]

[package.metadata.docs.rs]
all-features = true

[features]
# The default build is the crypto and the policy model, nothing else: no
# serde, no TOML parser, no proc macro.
default = []
# `Deserialize` on `MaskSpec` and the `policy` types, so a policy can be read
# from TOML/JSON/YAML with the caller's own parser.
serde = ["dep:serde"]
# `keys::FileKeySource`, the dev/test keyfile. Pulls a TOML parser.
keyfile = ["serde", "dep:toml"]
# `#[derive(Protect)]`: record-level seal/open/search over a `Protector`.
derive = ["dep:dbsec-derive"]

[dependencies]
dbsec-derive = { workspace = true, optional = true }
aes = { workspace = true }
aes-gcm = { workspace = true }
fpe = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
hex = { workspace = true }
serde = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
# `examples/embedded.rs`: the library in a plain sqlx application, run by
# `make e2e`. Same sqlx features the proxy's driver matrix uses.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "derive"] }
tokio = { workspace = true }

[[example]]
name = "embedded"
required-features = ["derive", "keyfile"]

[package]
name = "dbsec-core"
description = "Field-level encryption, pseudonymization and masking for PostgreSQL columns"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# `#[derive(Protect)]`: record-level seal/open/search over a `Protector`.
derive = ["dep:dbsec-derive"]

[dependencies]
dbsec-derive = { workspace = true, optional = true }
aes = { workspace = true }
aes-gcm = { workspace = true }
fpe = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
# `examples/embedded.rs`: the library in a plain sqlx application, run by
# `make e2e`. Same sqlx features the proxy's driver matrix uses.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "derive"] }
tokio = { workspace = true }

[[example]]
name = "embedded"
required-features = ["derive"]

[package]
name = "dbsec"
description = "Transparent PostgreSQL proxy for field-level encryption"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "dbsec"
path = "src/main.rs"

[dependencies]
dbsec-core = { workspace = true, features = ["keyfile"] }
dbsec-pgwire = { workspace = true }
tokio = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pki-types = { workspace = true }
tokio-postgres = { workspace = true }
tokio-postgres-rustls = { workspace = true }
sqlparser = { workspace = true }
vaultrs = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
# The e2e suite proves a `#[derive(Protect)]` record and the proxy agree.
dbsec-core = { workspace = true, features = ["derive"] }
futures-util = { workspace = true }
# `test-util` for `#[tokio::test(start_paused = true)]`: the relay's drain
# deadline is measured in seconds, and a paused clock asserts it without
# spending them.
tokio = { workspace = true, features = ["test-util"] }
proptest = { workspace = true }
rcgen = "0.13"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres"] }
tempfile = { workspace = true }
zeroize = { workspace = true }

[package]
name = "dbsec-vault"
description = "HashiCorp Vault / OpenBao KeySource for dbsec-core: Transit-wrapped DEKs and KV-stored deterministic keys"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Higher than the workspace floor: `url` -> `idna` -> `icu_*` 2.x needs 1.86.
rust-version = "1.86"
readme = "README.md"
documentation = "https://docs.rs/dbsec-vault"
keywords = ["vault", "openbao", "encryption", "kms", "postgresql"]
categories = ["cryptography", "database"]

[dependencies]
dbsec-core = { workspace = true }
vaultrs = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# `block_in_place` (rt-multi-thread) bridges the sync `KeySource` to the
# async client; `time` bounds every bridged lookup and paces the token watch.
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "time", "macros"] }

[dev-dependencies]
toml = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
